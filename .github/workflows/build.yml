name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Agent
        run: dotnet restore .\src\CrashScope.Agent\CrashScope.Agent.csproj
      - name: Restore Actions
        run: dotnet restore .\src\CrashScope.Actions\CrashScope.Actions.csproj
      - name: Build Agent
        run: dotnet build .\src\CrashScope.Agent\CrashScope.Agent.csproj -c Release --no-restore
      - name: Build Actions
        run: dotnet build .\src\CrashScope.Actions\CrashScope.Actions.csproj -c Release --no-restore
      - name: Publish self-contained test build
        if: github.event_name == 'push'
        run: dotnet publish .\src\CrashScope.Agent\CrashScope.Agent.csproj -c Release -r win-x64 --self-contained true -o .\dist\win-x64
      - name: Upload Windows test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CrashScope-win-x64
          path: .\dist\win-x64\
          if-no-files-found: error
